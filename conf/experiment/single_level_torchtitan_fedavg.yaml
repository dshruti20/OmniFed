# @package _global_
# Single-level centralized FedAvg with TorchTitan inside each client.
#
#   ./main.sh --config-name experiment/single_level_torchtitan_fedavg \
#     overwrite=true slurm.account=... slurm.partition=batch
#
# This path does not use OmniFed Node/topology. Each client is a subcluster.
# 4a (this default): num_clients>=2, dedicated gRPC server on HOSTS[0].
# 4b: torchtitan.subclusters.num_clients=1 → one Titan, no federated server srun.

defaults:
  - /base
  - /algorithm_torchtitan: fedavg
  - _self_

engine:
  mode: slurm
  client_runtime: torchtitan

backend:
  internal_backend: torchtitan

topology: null
algorithm: null
model: null
datamodule: null

global_rounds: 2
overwrite: false

torchtitan:
  module: llama3
  config_name: llama3_8b
  attention_backend: flex
  root: ${oc.env:TORCHTITAN_ROOT,null}
  hf_assets_path: ${oc.env:TORCHTITAN_HF_ASSETS,null}
  dataset_path: ${oc.env:TORCHTITAN_DATASET,null}
  output_dir: ${oc.env:OMNIFED_TORCHTITAN_SCRATCH,outputs/torchtitan}/runtime
  update_dir: ${oc.env:OMNIFED_TORCHTITAN_SCRATCH,outputs/torchtitan}/updates
  overrides:
    dataloader.dataset: c4_test
    training.steps: 6
    training.seq_len: 1024
    training.local_batch_size: 2
    checkpoint.enable: true
    checkpoint.last_save_model_only: true
  subclusters:
    enabled: true
    num_clients: 2
    nodes_per_client: 4
    gpus_per_node: 8
    leader_rank: 0
    master_port_base: 29600
    checkpoint_root: ${oc.env:OMNIFED_TORCHTITAN_SCRATCH,outputs/torchtitan}
  federated:
    local_steps: 3
    server_port: 50051
    grpc_chunk_size_mb: 64
    aggregation_timeout: 3600

slurm:
  enabled: true
  exclusive: true
  nodes: 9
  ntasks_per_node: 8
